# Build and verify locally, then publish directly to DEV ECR.
name: image
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 게시 검증 회귀 시험 (실제 Docker 포함)
        run: python3 .github/scripts/test_publish_dev_ecr.py
        env:
          PUBLISH_REAL_DOCKER: '1'
      - name: 모델 다운로드 재시도 단위 검증
        run: python3 -m unittest discover -s prototype/tools -p test_download_models.py
      - uses: docker/setup-buildx-action@v3
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: prototype
          platforms: ${{ matrix.platform }}
          load: true
          tags: nineouting-verified:local
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,scope=${{ matrix.pair }},mode=max
      - name: 확인할 이미지
        run: echo "REF=nineouting-verified:local" >> "$GITHUB_ENV"
      - name: 이미지 크기
        run: |
          size=$(docker image inspect "$REF" --format '{{.Size}}')
          echo "${{ matrix.platform }} 이미지 크기(압축 풀린 상태): $((size / 1000000)) MB (${size} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 모델 확인
        run: |
          docker run --rm --network none -e PYTHONPATH=/app/app "$REF" python -c "
          import os, platform
          from engine import make_rec, DEFAULT_MODELS
          rec = make_rec(DEFAULT_MODELS + '/zipformer-174m', '64', 'modified_beam_search',
                         hotwords='/app/app/hotwords.txt')
          rec.create_stream()
          assert os.path.exists(DEFAULT_MODELS + '/speaker/silero_vad.onnx'), 'VAD 모델 없음'
          open('/app/transcripts/.write-check', 'w').close()   # 실행 사용자가 전사 폴더에 쓸 수 있는지
          print('모델 확인 uid=%d arch=%s 전사 폴더 쓰기 됨' % (os.getuid(), platform.machine()))
          " | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 배포 연결 유지 검증
        run: docker run --rm --network none "$REF" python -m unittest discover -s tools -p 'test_drain*.py'
      - name: Save exact built image
        if: matrix.platform == 'linux/amd64' && (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        run: docker save nineouting-verified:local | gzip > verified-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux/amd64' && (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        with:
          name: verified-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-image.tar.gz
          retention-days: 1
          if-no-files-found: error
  dev-ecr:
    name: Verify and publish DEV ECR image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      EXPECTED_ACCOUNT: '443845329525'
      TARGET_IMAGE: 443845329525.dkr.ecr.ap-northeast-2.amazonaws.com/nineouting-dev-stt
      LOCAL_IMAGE: nineouting-verified:local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Load verified image
        run: gunzip -c verified-image.tar.gz | docker load
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to DEV with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::443845329525:role/nineouting-dev-stt-github
          aws-region: ap-northeast-2
          role-session-name: gha-${{ github.run_id }}
      - name: Check account
        shell: bash
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          test "$account" = "$EXPECTED_ACCOUNT"
          echo "AWS account verified: $account"
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish and verify exact local image in DEV ECR
        id: publish
        run: bash .github/scripts/publish-dev-ecr.sh
      - name: Save verified image reference
        uses: actions/upload-artifact@v4
        with:
          name: dev-ecr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image-result.txt
            ecr-manifest.txt
            ecr-manifest-raw.json
          retention-days: 30
  dev-gitops:
    name: Create verified STT DEV image PR
    needs: dev-ecr
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: dev-gitops-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check GitOps token registration
        env:
          DEV_GITOPS_TOKEN: ${{ secrets.DEV_GITOPS_TOKEN }}
        run: |
          if [ -z "$DEV_GITOPS_TOKEN" ]; then
            echo '::error::Register DEV_GITOPS_TOKEN with infra Contents/Pull requests write access'
            exit 1
          fi
      - name: Checkout infrastructure promotion tool
        uses: actions/checkout@v4
        with:
          repository: nineOuting/nineouting-infra
          ref: dev
          token: ${{ secrets.DEV_GITOPS_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dev-ecr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-image
      - name: Create verified STT values PR
        run: python3 scripts/dev/promote-image.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEV_GITOPS_TOKEN: ${{ secrets.DEV_GITOPS_TOKEN }}
  # 버전 릴리스 (2026-11-27). DEV 이미지마다 <다음 정식 버전>-dev.<순번> 사전 릴리스, ECR 이미지에도 같은 태그
  dev-release:
    name: DEV 버전 릴리스
    needs: dev-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-2
      TARGET_IMAGE: 443845329525.dkr.ecr.ap-northeast-2.amazonaws.com/nineouting-dev-stt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dev-ecr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-image
      - name: Authenticate to DEV with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::443845329525:role/nineouting-dev-stt-github
          aws-region: ap-northeast-2
          role-session-name: gha-release-${{ github.run_id }}
      - name: 버전 태그와 사전 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh dev
  # main 머지마다 정식 버전 (v1.0.0부터 패치 번호 +1). 운영 서버 준비 전이라 이미지는 만들지 않는다
  release:
    name: 정식 버전 릴리스
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 정식 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh main
'on':
  push:
    branches:
      - develop
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
    paths:
      - prototype/**
      - .github/workflows/image.yml
      - .github/scripts/publish-dev-ecr.sh
      - .github/scripts/test_publish_dev_ecr.py
  pull_request:
    paths:
      - prototype/**
      - .github/workflows/image.yml
      - .github/scripts/publish-dev-ecr.sh
      - .github/scripts/test_publish_dev_ecr.py
  workflow_dispatch: null
