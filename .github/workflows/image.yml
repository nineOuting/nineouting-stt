# STT를 로컬에서 빌드·검증한 뒤 DEV ECR에 직접 게시한다.
# PR/수동 실행은 검증만 수행하며 develop push만 ECR 및 GitOps PR을 생성한다.
name: image
on:
  push:
    branches: [develop]
    paths:
      - 'prototype/**'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 모델 다운로드 재시도 단위 검증
        run: python3 -m unittest discover -s prototype/tools -p test_download_models.py
      - uses: docker/setup-buildx-action@v3
      - name: AMD64 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: prototype
          platforms: linux/amd64
          load: true
          tags: nineouting-stt:verified
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,scope=linux-amd64,mode=max
      - name: 모델 확인
        run: |
          docker run --rm --network none -e PYTHONPATH=/app/app nineouting-stt:verified python -c "
          import os, platform
          from engine import make_rec, DEFAULT_MODELS
          rec = make_rec(DEFAULT_MODELS + '/zipformer-174m', '64', 'modified_beam_search',
                         hotwords='/app/app/hotwords.txt')
          rec.create_stream()
          assert os.path.exists(DEFAULT_MODELS + '/speaker/silero_vad.onnx')
          open('/app/transcripts/.write-check', 'w').close()
          assert platform.machine() == 'x86_64'
          "
      - name: 배포 연결 유지 검증
        run: docker run --rm --network none nineouting-stt:verified python -m unittest discover -s tools -p 'test_drain*.py'
      - name: 검증 이미지 저장
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: docker save nineouting-stt:verified | gzip > verified-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          name: verified-stt-image
          path: verified-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  dev-ecr:
    name: Verify and publish DEV ECR image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      EXPECTED_ACCOUNT: '443845329525'
      TARGET_IMAGE: 443845329525.dkr.ecr.ap-northeast-2.amazonaws.com/nineouting-dev-stt
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-stt-image
      - name: 검증 이미지 불러오기
        run: gunzip -c verified-image.tar.gz | docker load
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to DEV with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::443845329525:role/nineouting-dev-stt-github
          aws-region: ap-northeast-2
          role-session-name: gha-${{ github.run_id }}
      - name: Check account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
      - uses: aws-actions/amazon-ecr-login@v2
      - name: 검증 이미지를 ECR에 직접 게시
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target="$TARGET_IMAGE:$tag"
          local_id=$(docker image inspect nineouting-stt:verified --format '{{.Id}}')
          test "$(docker image inspect nineouting-stt:verified --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker tag nineouting-stt:verified "$target"
          docker push "$target"
          docker buildx imagetools inspect "$target" > ecr-manifest.txt
          digest=$(awk '$1 == "Digest:" {print $2; exit}' ecr-manifest.txt)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "$TARGET_IMAGE@$digest" > ecr-manifest-raw.json
          test "$(jq -er '.config.digest' ecr-manifest-raw.json)" = "$local_id"
          docker pull --platform linux/amd64 "$TARGET_IMAGE@$digest"
          test "$(docker image inspect "$TARGET_IMAGE@$digest" --format '{{.Id}}')" = "$local_id"
          test "$(docker image inspect "$TARGET_IMAGE@$digest" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          printf 'image.repository=%s\nimage.digest=%s\nimage.tag=%s\nimage.uri=%s\n' \
            "$TARGET_IMAGE" "$digest" "$tag" "$TARGET_IMAGE@$digest" > image-result.txt
          echo "Verified DEV ECR image: $TARGET_IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Save verified image reference
        uses: actions/upload-artifact@v4
        with:
          name: dev-ecr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image-result.txt
            ecr-manifest.txt
            ecr-manifest-raw.json
          retention-days: 30
          if-no-files-found: error

  dev-gitops:
    name: Create verified STT DEV image PR
    needs: dev-ecr
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: dev-gitops-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check GitOps token registration
        env:
          DEV_GITOPS_TOKEN: ${{ secrets.DEV_GITOPS_TOKEN }}
        run: |
          if [ -z "$DEV_GITOPS_TOKEN" ]; then
            echo '::error::Register DEV_GITOPS_TOKEN with infra Contents/Pull requests write access'
            exit 1
          fi
      - name: Checkout infrastructure promotion tool
        uses: actions/checkout@v4
        with:
          repository: nineOuting/nineouting-infra
          ref: dev
          token: ${{ secrets.DEV_GITOPS_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dev-ecr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-image
      - name: Create verified STT values PR
        run: python3 scripts/dev/promote-image.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEV_GITOPS_TOKEN: ${{ secrets.DEV_GITOPS_TOKEN }}
