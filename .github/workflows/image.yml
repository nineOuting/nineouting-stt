# STT 이미지를 만들어 GHCR(ghcr.io/nineouting/nineouting-stt)에 올림.
# 같은 조직 레포라 따로 받을 자격증명이 없고, 아래 permissions와 기본 GITHUB_TOKEN이면 됨.
#
# 태그: 브랜치 이름 + 커밋 SHA. 백엔드 서비스 레포의 ci.yml과 같은 모양
# 끌어 쓰기: docker pull ghcr.io/nineouting/nineouting-stt:develop
name: image

on:
  push:
    branches: [develop]
    paths:
      - 'prototype/**'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/nineouting/nineouting-stt   # GHCR 주소는 소문자만 받음 (조직 이름은 nineOuting)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # pull_request에서는 만들어만 보고 올리지 않음 (고치는 중에 이미지가 쌓이지 않게)
      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그는 백엔드 서비스(nineouting-meeting-service의 ci.yml)와 같은 모양으로 맞춤:
      # 브랜치 이름 + 커밋 SHA(접두사 없이)
      - name: 만들어서 올리기
        uses: docker/build-push-action@v6
        with:
          context: prototype
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:develop
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 이미지 크기
        if: github.event_name != 'pull_request'
        run: |
          docker pull "${IMAGE}:${GITHUB_SHA}"
          docker image ls "${IMAGE}" --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

  # 태그가 붙지 않은 옛 이미지를 치움 (모델 층이 바뀔 때마다 쌓이므로)
  cleanup:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: nineouting-stt
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
